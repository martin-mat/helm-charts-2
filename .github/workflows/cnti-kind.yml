# Fork-only experiment: is the runner's AppArmor profile for /usr/sbin/mysqld
# what keeps MySQL 9 (the OAI core peer) from reading its own config on kind?
# Two jobs, the same kind cluster and the core without any workaround: one with
# the profile loaded, one with it unloaded. Not meant for upstream.
name: CNTi on kind (fork experiment)
on:
  push:
    branches: [cnti-kind]
  workflow_dispatch:
jobs:
  apparmor:
    strategy:
      fail-fast: false
      matrix:
        profile: [kept, unloaded]
    name: mysqld profile ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Core charts (openairinterface/orchestration)
        uses: actions/checkout@v4
        with:
          repository: openairinterface/orchestration
          ref: removing-ran-e2e-charts
          path: orchestration
          persist-credentials: false
      - name: AppArmor on the runner
        run: |
          uname -r
          ls -l /etc/apparmor.d/ | grep -i mysql || echo "no mysql profile file"
          sudo aa-status 2>/dev/null | grep -i -E 'mysql|profiles are loaded' || true
      - name: Unload the mysqld profile
        if: matrix.profile == 'unloaded'
        run: |
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld
          sudo aa-status 2>/dev/null | grep -i mysql || echo "mysqld profile no longer loaded"
      - name: Write the kind config
        run: |
          cat > "$RUNNER_TEMP/kind.yaml" <<'KIND'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
            - role: worker
          KIND
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: cnti-testsuite
          config: ${{ runner.temp }}/kind.yaml
      - name: Core peer, without any workaround
        run: |
          set -uo pipefail
          helm dependency update orchestration/charts/oai-5g-basic >/dev/null
          start=$(date +%s)
          if helm install basic orchestration/charts/oai-5g-basic -n oai-core --create-namespace --wait --timeout 12m; then
            echo "CORE PEER READY (profile ${{ matrix.profile }}) after $(( $(date +%s) - start ))s"
          else
            echo "CORE PEER NOT READY (profile ${{ matrix.profile }}) after $(( $(date +%s) - start ))s"
          fi
          kubectl -n oai-core get pods -o wide
          p=$(kubectl -n oai-core get pods -o name | grep mysql | head -1)
          kubectl -n oai-core logs "$p" --tail=40 | grep -E 'ready for connections|errmsg|defaults file|ERROR' || true
      - name: AppArmor denials in the kernel log
        if: always()
        run: |
          sudo dmesg | grep -i 'apparmor="DENIED"' | grep -i mysql | sed -E 's/.*(apparmor="DENIED".*)/\1/' | cut -c1-260 | sort | uniq -c | sort -rn | head -20 || true
          echo "DENIALS for mysqld: $(sudo dmesg | grep -i 'apparmor="DENIED"' | grep -ci mysqld)"
